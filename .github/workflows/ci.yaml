name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64, linux/arm/v7]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        run: docker buildx build --platform '${{ matrix.platform }}' --load -t serial-console:test ./serial_console
      - name: Validate and exercise actual packaged services
        run: |
          docker run --rm --platform '${{ matrix.platform }}' \
            --entrypoint /bin/sh -v "$PWD:/project:ro" serial-console:test -ec '
              apk add --no-cache py3-websocket-client py3-yaml openssl shellcheck
              apk info -v ser2net gensio-libs ttyd socat
              cd /project
              shellcheck serial_console/run.sh
              python3 -m unittest discover -s tests -p "test_*.py" -v
              python3 tests/integration.py
            '
